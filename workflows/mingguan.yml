name: Caption Mingguan Otani

# Jalan otomatis tiap Minggu 17:00 WIB (10:00 UTC).
# Cron GitHub Actions memakai UTC. 10:00 UTC = 17:00 WIB.
on:
  schedule:
    - cron: "0 10 * * 0"
  # Tombol "Run workflow" manual di tab Actions (buat tes kapan saja)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tes tanpa kirim WA? (1 = ya, 0 = kirim beneran)"
        default: "1"
        required: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate caption & kirim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}
          # Jadwal mingguan selalu kirim beneran (DRY_RUN=0).
          # Saat dijalankan manual, pakai pilihan dari tombol (default 1 = aman, tidak kirim).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
        run: python generate_and_send.py

      - name: Simpan arsip caption
        uses: actions/upload-artifact@v4
        with:
          name: caption-minggu-ini
          path: output/*.txt
          if-no-files-found: warn
